    <script>
      (function() {
        // Suppress unhandled exceptions originating strictly from 3rd-party browser extensions
        var isExtensionOrExternalError = function(msg, src) {
          if (typeof src === 'string' && src.length > 0 && (
            src.indexOf('chrome-extension://') !== -1 ||
            src.indexOf('moz-extension://') !== -1 ||
            src.indexOf('safari-extension://') !== -1 ||
            src.indexOf('extension://') !== -1
          )) {
            return true;
          }
          if (typeof msg === 'string' && (
            msg.indexOf('ResizeObserver loop') !== -1
          )) {
            return true;
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          if (
            isExtensionOrExternalError(event.message, event.filename) ||
            (event.error && isExtensionOrExternalError(event.error.message, event.filename))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          if (isExtensionOrExternalError(msg, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        // Ensure window.fetch is writable for extensions/tools without altering Window.prototype
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (desc && !desc.writable && desc.configurable) {
              Object.defineProperty(window, 'fetch', {
                value: window.fetch.bind(window),
                writable: true,
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {}
      })();
    </script>
